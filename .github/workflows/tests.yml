name: tests

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The suite never reaches a device or the network: no simulator, no
      # Metro, no .env. jest-expo runs the components under react-test-renderer
      # and the native modules are mocked, so a plain runner is the whole
      # environment this needs.
      - name: Run CI Checks
        run: npm run ci

  # The update host is a separate module in server/ and shares nothing with the
  # app -- no dependency, no toolchain, no reason to wait on Metro. Its own job
  # so a broken bundler never hides a broken manifest, or the other way round.
  server:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          # The module has no dependencies, so there is no go.sum to key a
          # cache on and nothing worth caching if there were.
          cache: false

      - name: Vet
        run: go vet ./...

      - name: Tests
        run: go test ./...
